<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Country Explorer</title>
<meta name="description" content="An interactive world map and country almanac built entirely on live open data — Wikidata, the World Bank, and OpenStreetMap.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.wikidata.org">
<link rel="preconnect" href="https://query.wikidata.org">
<link rel="preconnect" href="https://api.worldbank.org">
<link rel="preconnect" href="https://en.wikipedia.org">
<link rel="preconnect" href="https://commons.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/reset.css">
<link rel="stylesheet" href="styles/variables.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="components/shared/shared.css">
<link rel="stylesheet" href="components/world-map/world-map.css">
<link rel="stylesheet" href="components/world-map/map-overlays.css">
<link rel="stylesheet" href="components/search/search-bar.css">
<link rel="stylesheet" href="components/side-panel/side-panel.css">
<link rel="stylesheet" href="components/country-page/country-page.css">
<link rel="stylesheet" href="components/anthem-player/anthem-player.css">
<link rel="stylesheet" href="components/about/about.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<main id="main-content" class="app-main">
  <section id="view-map" class="view" aria-label="World map explorer">
    <div id="world-map-mount"></div>
    <div id="search-mount"></div>
    <div id="side-panel-mount"></div>
  </section>

  <section id="view-country" class="view" hidden tabindex="-1" aria-label="Country details">
    <div id="country-page-mount"></div>
  </section>
</main>

<div id="anthem-player-root"></div>
<div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

<!-- Third-party libraries: classic UMD builds, no bundler. Loaded with defer so they
     never block parsing; they still run before the module entry below because defer
     scripts and module scripts execute in document order once parsing finishes. -->
<script defer src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.2.0/dist/fuse.min.js"></script>

<script type="module" src="lib/main.js"></script>
</body>
</html>
